# iShares STOXX Europe 600 sector ETFs on Xetra (plus two benchmarks).
# The whole list is validated at runtime: the collector downloads whatever
# is listed and records anything that returns no data in meta.json.
# Entries with `verify: true` have a best-effort sector mapping that has
# not been confirmed against ishares.com -- check the label before relying
# on it (the EXV*/EXH*/EXI* code-to-sector scheme is easy to mix up).
etfs_eu:
  - {ticker: EXSA.DE, name: "STOXX Europe 600",       group: benchmark}
  - {ticker: EXS1.DE, name: "DAX",                    group: benchmark}
  - {ticker: EXV1.DE, name: "Europe Banks",           group: sector, subgroup: banks}
  - {ticker: EXV3.DE, name: "Europe Technology",      group: sector, subgroup: technology}
  - {ticker: EXV4.DE, name: "Europe Health Care",     group: sector, subgroup: health-care}
  - {ticker: EXV6.DE, name: "Europe Basic Resources", group: sector, subgroup: basic-resources}
  - {ticker: EXV2.DE, name: "Europe Telecommunications",     group: sector, subgroup: telecommunications, verify: true}
  - {ticker: EXV5.DE, name: "Europe Automobiles & Parts",    group: sector, subgroup: automobiles-parts, verify: true}
  - {ticker: EXV7.DE, name: "Europe Chemicals",              group: sector, subgroup: chemicals, verify: true}
  - {ticker: EXV8.DE, name: "Europe Construction & Materials", group: sector, subgroup: construction-materials, verify: true}
  - {ticker: EXV9.DE, name: "Europe Travel & Leisure",       group: sector, subgroup: travel-leisure, verify: true}
  - {ticker: EXH1.DE, name: "Europe Energy",                 group: sector, subgroup: energy, verify: true}
  - {ticker: EXH2.DE, name: "Europe Financial Services",     group: sector, subgroup: financial-services, verify: true}
  - {ticker: EXH3.DE, name: "Europe Food & Beverage",        group: sector, subgroup: food-beverage, verify: true}
  - {ticker: EXH4.DE, name: "Europe Industrial Goods & Services", group: sector, subgroup: industrials, verify: true}
  - {ticker: EXH5.DE, name: "Europe Insurance",              group: sector, subgroup: insurance, verify: true}
  - {ticker: EXH6.DE, name: "Europe Media",                  group: sector, subgroup: media, verify: true}
  - {ticker: EXH7.DE, name: "Europe Personal & Household Goods", group: sector, subgroup: personal-household-goods, verify: true}
  - {ticker: EXH8.DE, name: "Europe Retail",                 group: sector, subgroup: retail, verify: true}
  - {ticker: EXH9.DE, name: "Europe Utilities",              group: sector, subgroup: utilities, verify: true}
  - {ticker: EXI5.DE, name: "Europe Real Estate",            group: sector, subgroup: real-estate, verify: true}

indices_eu: ["^STOXX", "^STOXX50E", "^GDAXI", "^FCHI", "^AEX", "^BFX", "^IBEX", "FTSEMIB.MI"]

fx: ["EURUSD=X"]

vol: ["^VIX", "^VIX3M"]

