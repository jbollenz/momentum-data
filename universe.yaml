# universe.yaml -- single source of truth for the ticker universe.
#
# collector.py reads this file on every run. Edit it (add/remove entries),
# commit, and the next run picks up the change. All tickers use Yahoo
# Finance notation (exchange suffixes like .DE/.PA/.AS, ^ for indices,
# =X for FX).
#
# `verify: true` marks entries whose sector/name mapping has NOT been
# hand-checked against the issuer's site. The data itself is still
# collected; the flag only means "double-check the label before trusting
# it in the dashboard UI".

etfs_us:
  # --- benchmarks -------------------------------------------------------
  - {ticker: SPY,  name: "S&P 500",              group: benchmark}
  - {ticker: RSP,  name: "S&P 500 Equal Weight", group: benchmark}
  - {ticker: QQQ,  name: "Nasdaq 100",           group: benchmark}
  - {ticker: IWM,  name: "Russell 2000",         group: benchmark}
  # --- factor proxies (red-team round 2, ADD #4) ------------------------
