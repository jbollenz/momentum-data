# Sentinel: the collector resolves this to the current S&P 500 member list
# from the `datasets/s-and-p-500-companies` GitHub dataset. On download
# failure it falls back to the cached copy in data/sp500_constituents.csv.
stocks_us: "auto:sp500"

# FRED series pulled as 8 years of daily/weekly history (percentile
# baselines need the depth). VIXCLS = VIX close, BAMLH0A0HYM2 = US high-yield
# OAS, T10Y2Y = 10y-2y spread, DGS10/DGS2 = 10y/2y Treasury constant maturity,
# DTWEXBGS = broad trade-weighted dollar, BAMLC0A0CM = US investment-grade OAS,
# NFCI = Chicago Fed National Financial Conditions Index (weekly).
fred_series: [VIXCLS, BAMLH0A0HYM2, T10Y2Y, DGS10, DGS2, DTWEXBGS, BAMLC0A0CM, NFCI]
